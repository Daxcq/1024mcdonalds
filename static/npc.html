<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦当劳 · 与小麦交谈</title>
<style>
  :root { --red:#c8102e; --dark:#8f0b20; --gold:#ffbc0d; --cream:#fff3d6; --paper:#fbe9bf; --ink:#3a2210; --ok:#2e7d32; --grey:#b9a98a; --sh:rgba(0,0,0,.28); }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#2a1a10; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #1a73e8; outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .btn { background:var(--gold); border:3px solid var(--ink); border-radius:8px; padding:8px 14px; font-weight:800; box-shadow:0 4px 0 var(--ink); }
  .btn:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.red { background:var(--red); color:#fff; }
  .chip { display:inline-block; background:#fff; border:2px solid var(--ink); border-radius:999px; padding:4px 12px; font-size:13px; color:inherit; text-decoration:none; }
  a.chip:hover, button.chip:hover { background:var(--gold); }

  /* 场景: 店内柜台, 沿用工坊左栏的斜纹墙面 */
  .stage { position:fixed; inset:0; overflow:hidden; }
  .wall { position:absolute; inset:0; background:repeating-linear-gradient(45deg,#f1d9a6 0 24px,#ecd09a 24px 48px); }
  .shade { position:absolute; inset:0; pointer-events:none; z-index:5; background:radial-gradient(ellipse at 38% 42%, rgba(0,0,0,0) 45%, rgba(58,34,16,.55) 100%); }
  .boards { position:absolute; top:5vh; left:36vw; right:150px; display:flex; gap:2vw; justify-content:center; }
  .board { flex:1; max-width:15vw; min-width:64px; padding:1.2vh .6vw; text-align:center; background:#2a1a10; color:var(--gold); border:4px solid var(--ink); border-radius:6px;
           font-weight:900; letter-spacing:2px; font-size:clamp(12px,1.6vw,22px); box-shadow:0 0 0 3px var(--dark), 0 0 24px rgba(255,188,13,.35); }
  .board small { display:block; margin-top:2px; color:#fff; font-size:.55em; font-weight:500; letter-spacing:1px; opacity:.85; }
  .floor { position:absolute; left:0; right:0; bottom:0; height:14vh; z-index:1; border-top:6px solid var(--ink);
           background:conic-gradient(#d9b46a 25%, #e9cc8c 0 50%, #d9b46a 0 75%, #e9cc8c 0) 0 0/64px 64px; }
  .counter { position:absolute; left:0; right:0; bottom:14vh; height:10vh; z-index:3; background:repeating-linear-gradient(90deg,var(--red) 0 120px,#b00e28 120px 124px);
             border-top:10px solid var(--gold); box-shadow:0 -6px 0 var(--ink); }
  #fx, #fx2 { position:absolute; inset:0; overflow:hidden; z-index:1; pointer-events:none; }
  .seed { position:absolute; top:-20px; height:6px; background:#f7e1a0; border:2px solid #c99a3c; border-radius:50%; opacity:.9; animation:fall linear infinite; }
  @keyframes fall { to { transform:translate(var(--dx), 112vh) rotate(var(--rot)); } }
  .actor { position:absolute; width:clamp(72px,9vw,132px); transform:translateX(-50%); }
  .actor svg { width:100%; display:block; image-rendering:pixelated; }
  .actor.npc { z-index:2; bottom:20vh; width:clamp(90px,11vw,170px); cursor:pointer; }
  .actor.npc.near svg { animation:bob .6s steps(2) infinite; }
  .actor.me { z-index:4; bottom:1.5vh; width:clamp(84px,10vw,150px); }
  .actor.me svg { transform-origin:50% 100%; transform:scaleX(var(--face,1)); }
  .actor.me.walk svg { animation:step .24s steps(2) infinite; }
  @keyframes step { 0%,100% { transform:scaleX(var(--face,1)); } 50% { transform:translateY(-5px) scaleX(var(--face,1)); } }
  @keyframes bob { 50% { transform:translateY(-4px); } }
  .tip { position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); white-space:nowrap; background:#fff; border:3px solid var(--ink);
         border-radius:8px; padding:5px 12px; font-weight:800; font-size:14px; box-shadow:3px 3px 0 var(--sh); animation:bob .6s steps(2) infinite; }
  .tip::after { content:""; position:absolute; left:50%; top:100%; margin-left:-8px; border:8px solid transparent; border-top-color:var(--ink); border-bottom:0; }
  kbd { display:inline-block; min-width:1.6em; text-align:center; background:var(--gold); border:2px solid var(--ink); border-radius:4px; padding:0 4px; font:800 13px/1.5 inherit; box-shadow:0 2px 0 var(--ink); }
  .hud { position:absolute; top:12px; left:12px; right:12px; z-index:6; display:flex; gap:8px; align-items:center; flex-wrap:wrap; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  .hud .sp { flex:1; pointer-events:none; }
  .pad { position:absolute; z-index:6; left:50%; bottom:3vh; transform:translateX(-50%); display:flex; gap:10px; align-items:center; }
  .pad .btn { min-width:52px; padding:6px 12px; }
  .pad .hint { background:rgba(42,26,16,.82); color:#fff; border-radius:999px; padding:5px 14px; font-size:13px; }
  .pad .hint kbd { color:var(--ink); }
  /* ---------- 对话场景: 立绘在左, 地点牌在右竖排, 底部对话框 ---------- */
  .vn { position:fixed; inset:0; z-index:20; display:none; background:#2a1a10; }
  .vn.open { display:block; animation:fadein .35s ease-out; }
  @keyframes fadein { from { opacity:0; } }
  .vn .bg { position:absolute; inset:0; background:
              linear-gradient(180deg, rgba(143,11,32,.0) 55%, rgba(58,34,16,.55) 100%),
              repeating-linear-gradient(45deg,#f1d9a6 0 24px,#ecd09a 24px 48px); }
  .vn .bg::before { content:""; position:absolute; left:0; right:0; top:0; height:11vh; background:var(--red); border-bottom:6px solid var(--dark); }
  .vn .bg::after { content:""; position:absolute; left:0; right:0; bottom:0; height:30vh; background:linear-gradient(180deg,transparent,rgba(58,34,16,.5)); }
  .portrait { position:absolute; left:3vw; bottom:21vh; height:72vh; aspect-ratio:16/18; z-index:2; filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(6px 8px 0 var(--sh)); }
  .portrait svg { width:100%; height:100%; image-rendering:pixelated; }
  .portrait.talk svg { animation:bob .5s steps(2) infinite; }
  .plaque { position:absolute; right:3vw; top:0; width:clamp(64px,7vw,96px); z-index:3; background:var(--cream); border:4px solid var(--ink); border-top:0;
            border-radius:0 0 10px 10px; box-shadow:0 0 0 3px var(--gold) inset, 4px 6px 0 var(--sh); padding:14px 6px 18px; text-align:center; }
  .plaque .logo { width:44px; height:44px; margin:0 auto 10px; border-radius:50%; background:var(--red); color:var(--gold); border:3px solid var(--ink);
                  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:26px; }
  .plaque .vt { writing-mode:vertical-rl; margin:0 auto; font-weight:900; letter-spacing:.35em; color:var(--red); font-size:clamp(20px,2.6vw,32px); }
  .plaque .loc { writing-mode:vertical-rl; margin:12px auto 0; padding-top:12px; border-top:2px solid var(--gold); font-size:13px; letter-spacing:.2em; color:#6b4a2b; max-height:34vh; overflow:hidden; text-overflow:ellipsis; }
  .vn-top { position:absolute; left:14px; top:12px; z-index:4; display:flex; gap:8px; align-items:center; }
  .vn-top .chip { font-weight:700; }
  .box { position:absolute; left:2.5vw; right:2.5vw; bottom:3vh; height:25vh; min-height:150px; z-index:4; background:var(--cream); border:4px solid var(--ink); border-radius:12px;
         box-shadow:0 0 0 4px var(--gold) inset, 0 0 0 4px var(--dark), 6px 8px 0 var(--sh); padding:5vh 4vw 2vh 5vw; cursor:pointer; }
  .nameplate { position:absolute; left:-1.2vw; top:-24px; display:flex; align-items:center; gap:8px; background:var(--dark); color:var(--gold); border:4px solid var(--ink);
               border-radius:999px; padding:2px 22px 2px 4px; font-weight:900; font-size:clamp(16px,1.7vw,22px); letter-spacing:3px; box-shadow:3px 4px 0 var(--sh); }
  .nameplate i { width:34px; height:34px; border-radius:50%; background:var(--gold); color:var(--red); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center;
                 font-style:normal; font-size:20px; letter-spacing:0; }
  .text { font-size:clamp(16px,1.75vw,24px); line-height:1.9; letter-spacing:1px; height:100%; overflow-y:auto; }
  .next { position:absolute; right:3vw; bottom:12px; width:0; height:0; border:12px solid transparent; border-top:16px solid var(--red); border-bottom:0; animation:blink .9s steps(2) infinite; }
  .next { display:none; }
  .box.more .next { display:block; }
  .box:focus-visible { outline:3px solid #1a73e8; outline-offset:4px; }
  @keyframes blink { 50% { transform:translateY(5px); } }
  .caret::after { content:"…"; animation:blink .6s steps(2) infinite; display:inline-block; }

  /* 选项: 压在对话框上方偏右, 键盘 1-4 / 方向键 / 回车 */
  .choices { position:absolute; right:6vw; bottom:calc(3vh + 25vh + 18px); z-index:6; display:flex; flex-direction:column; gap:10px; width:min(380px,86vw); }
  .choices[hidden] { display:none; }
  .choice { text-align:left; background:var(--cream); border:4px solid var(--ink); border-radius:10px; padding:10px 14px; font-weight:800; font-size:clamp(15px,1.5vw,19px);
            box-shadow:0 4px 0 var(--ink), 0 0 0 3px var(--gold) inset; display:flex; gap:10px; align-items:center; animation:pop .25s steps(3) backwards; }
  .choice kbd { flex:none; }
  .choice small { margin-left:auto; font-weight:500; font-size:12px; color:#6b4a2b; }
  .choice:hover, .choice:focus-visible { background:var(--gold); transform:translateX(-6px); }
  .choice.leave { background:#efe3c3; }
  @keyframes pop { from { transform:translateX(24px); opacity:0; } }
  /* 点单面板 / 选店 / 自由聊天: 叠在对话场景之上 */
  .sheet { position:absolute; z-index:8; left:50%; top:50%; transform:translate(-50%,-56%); width:min(860px,94vw); max-height:68vh; display:none; flex-direction:column;
           background:var(--paper); border:4px solid var(--ink); border-radius:12px; box-shadow:0 0 0 4px var(--gold) inset, 0 0 0 4px var(--dark), 8px 10px 0 var(--sh); }
  .sheet.open { display:flex; animation:pop2 .2s steps(3); }
  @keyframes pop2 { from { transform:translate(-50%,-50%) scale(.96); opacity:0; } }
  .sheet header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--red); color:var(--gold); border-bottom:4px solid var(--dark); font-weight:900; letter-spacing:2px; border-radius:7px 7px 0 0; }
  .sheet header .sp { flex:1; }
  .sheet header .chip { letter-spacing:0; color:var(--ink); }
  .sheet .body { display:flex; min-height:0; flex:1; }
  .tabs { display:flex; flex-direction:column; width:104px; flex:none; background:#f3d79b; border-right:3px solid #d9b46a; overflow-y:auto; }
  .tab { background:none; border:0; border-left:5px solid transparent; padding:12px 6px; font-weight:800; color:#9a8466; text-align:center; }
  .tab.on { color:var(--red); background:var(--cream); border-left-color:var(--red); }
  .items { flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; align-content:start; min-width:0; }
  .item { background:var(--cream); border:3px solid #e1bd75; border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; }
  .item.has { border-color:var(--red); background:#ffe9b0; }
  .item b { font-size:15px; line-height:1.35; }
  .item small { color:#6b4a2b; min-height:1.2em; }
  .item .row { display:flex; align-items:center; gap:8px; margin-top:auto; }
  .price { font-weight:900; color:var(--red); }
  .price s { color:var(--grey); font-weight:400; font-size:12px; margin-left:4px; }
  .qty { margin-left:auto; display:flex; align-items:center; gap:6px; }
  .qty button { width:32px; height:32px; padding:0; border-radius:8px; border:3px solid var(--ink); background:var(--gold); font-weight:900; line-height:1; }
  .qty button[aria-disabled="true"] { opacity:.4; cursor:not-allowed; }
  .qty output { min-width:1.5em; text-align:center; font-weight:900; }
  .sheet footer { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--cream); border-top:3px solid #d9b46a; border-radius:0 0 7px 7px; flex-wrap:wrap; }
  .sheet footer .total { font-size:22px; font-weight:900; color:var(--red); }
  .sheet footer .sp { flex:1; }
  .sheet footer .quote { font-size:13px; color:#6b4a2b; }
  .stores { padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; width:100%; }
  .store-item { text-align:left; background:#fff; border:3px solid var(--ink); border-radius:8px; padding:8px 10px; }
  .store-item small { display:block; color:#6b4a2b; }
  .store-item:hover { background:var(--gold); }
  .chatlog { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; min-height:120px; }
  .chatlog div { max-width:82%; padding:6px 12px; border:3px solid var(--ink); border-radius:10px; line-height:1.6; background:#fff; }
  .chatlog .you { align-self:flex-end; background:var(--gold); }
  .sheet form { display:flex; gap:6px; padding:10px 16px; background:var(--dark); border-radius:0 0 7px 7px; }
  .sheet form input { flex:1; padding:8px; border:3px solid var(--ink); border-radius:8px; font:inherit; min-width:0; }
  .toast { position:fixed; z-index:40; left:50%; top:14vh; transform:translateX(-50%); background:var(--ink); color:#fff; padding:6px 16px; border-radius:999px; font-size:14px; display:none; }
  .toast.on { display:block; }
  @media (max-width:700px) { .tabs { width:72px; } .items { grid-template-columns:1fr; } .portrait { height:46vh; left:-4vw; } .choices { right:3vw; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<!-- ============ 第一幕: 店内走动, 靠近小麦按 F ============ -->
<main class="stage" id="stage" aria-label="店内">
  <div class="wall"></div>
  <div class="boards" aria-hidden="true">
    <div class="board">汉堡<small>BURGERS</small></div>
    <div class="board">小食<small>SIDES</small></div>
    <div class="board">饮料<small>DRINKS</small></div>
    <div class="board">甜品<small>DESSERT</small></div>
  </div>
  <div id="fx" aria-hidden="true"></div>
  <div class="floor"></div>
  <div class="counter"></div>

  <div class="actor npc" id="npc" style="left:36%" role="button" tabindex="0" aria-label="店员小麦,按 F 或点击开始对话">
    <div class="tip" id="tip" hidden>按 <kbd>F</kbd> 与小麦交谈</div>
    <svg viewBox="0 0 16 18" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="8" height="3" fill="#222"/><rect x="3" y="3" width="10" height="2" fill="#222"/><rect x="6" y="2" width="4" height="2" fill="#ffbc0d"/><rect x="4" y="5" width="8" height="5" fill="#f2c8a0"/><rect x="6" y="7" width="1" height="1" fill="#222"/><rect x="9" y="7" width="1" height="1" fill="#222"/><rect x="7" y="9" width="2" height="1" fill="#b4542e"/><rect x="3" y="10" width="10" height="6" fill="#c8102e"/><rect x="6" y="11" width="4" height="2" fill="#ffbc0d"/><rect x="2" y="11" width="1" height="4" fill="#c8102e"/><rect x="13" y="11" width="1" height="4" fill="#c8102e"/><rect x="4" y="16" width="3" height="2" fill="#333"/><rect x="9" y="16" width="3" height="2" fill="#333"/></svg>
  </div>
  <div class="actor me" id="me" style="left:12%" aria-hidden="true">
    <svg viewBox="0 0 16 18" shape-rendering="crispEdges">
      <rect x="4" y="1" width="8" height="3" fill="#3a2210"/><rect x="3" y="3" width="10" height="2" fill="#3a2210"/>
      <rect x="4" y="5" width="8" height="5" fill="#f2c8a0"/>
      <rect x="6" y="7" width="1" height="1" fill="#222"/><rect x="9" y="7" width="1" height="1" fill="#222"/>
      <rect x="7" y="9" width="2" height="1" fill="#b4542e"/>
      <rect x="3" y="10" width="10" height="6" fill="#2f6fb5"/><rect x="6" y="11" width="4" height="1" fill="#fff"/>
      <rect x="2" y="11" width="1" height="4" fill="#2f6fb5"/><rect x="13" y="11" width="1" height="4" fill="#2f6fb5"/>
      <rect x="4" y="16" width="3" height="2" fill="#333"/><rect x="9" y="16" width="3" height="2" fill="#333"/>
    </svg>
  </div>

  <div class="hud">
    <a class="chip" href="/">← 汉堡工坊</a>
    <span class="chip" id="storeChip">未选门店</span>
    <span class="sp"></span>
    <span class="chip" id="cartChip">订单 ¥0</span>
  </div>
  <div class="pad">
    <button class="btn" id="goL" aria-label="向左走">◀</button>
    <span class="hint"><kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd> 移动 · <kbd>F</kbd> 交谈</span>
    <button class="btn" id="goR" aria-label="向右走">▶</button>
  </div>
  <div class="shade"></div>
</main>

<!-- ============ 第二幕: 专门的对话页面 ============ -->
<section class="vn" id="vn" role="dialog" aria-modal="true" aria-labelledby="whoName">
  <div class="bg"></div>
  <div id="fx2" aria-hidden="true"></div>
  <div class="vn-top"><button class="chip" id="bye" type="button">离开 <kbd>Esc</kbd></button></div>
  <div class="portrait" id="portrait" aria-hidden="true"><svg viewBox="0 0 16 18" shape-rendering="crispEdges"><rect x="4" y="1" width="8" height="3" fill="#222"/><rect x="3" y="3" width="10" height="2" fill="#222"/><rect x="6" y="2" width="4" height="2" fill="#ffbc0d"/><rect x="4" y="5" width="8" height="5" fill="#f2c8a0"/><rect x="6" y="7" width="1" height="1" fill="#222"/><rect x="9" y="7" width="1" height="1" fill="#222"/><rect x="7" y="9" width="2" height="1" fill="#b4542e"/><rect x="3" y="10" width="10" height="6" fill="#c8102e"/><rect x="6" y="11" width="4" height="2" fill="#ffbc0d"/><rect x="2" y="11" width="1" height="4" fill="#c8102e"/><rect x="13" y="11" width="1" height="4" fill="#c8102e"/><rect x="4" y="16" width="3" height="2" fill="#333"/><rect x="9" y="16" width="3" height="2" fill="#333"/></svg></div>
  <aside class="plaque" aria-label="地点:点单台">
    <div class="logo" aria-hidden="true">M</div>
    <div class="vt">点单台</div>
    <div class="loc" id="locName">地点・未选门店</div>
  </aside>

  <div class="choices" id="choices" role="group" aria-label="选项" hidden></div>

  <div class="sr" id="srSay" role="status" aria-live="polite"></div>
  <div class="box" id="box" tabindex="0" aria-label="小麦的对话,按回车继续">
    <div class="nameplate"><i aria-hidden="true">M</i><span id="whoName">小麦</span></div>
    <div class="text" id="text" aria-hidden="true"></div>
    <span class="next" aria-hidden="true"></span>
  </div>

  <!-- 点单 -->
  <div class="sheet" id="orderSheet" role="dialog" aria-label="点单">
    <header><span>点单</span><span class="sp"></span><button class="chip" type="button" data-close>返回对话 <kbd>Esc</kbd></button></header>
    <div class="body"><nav class="tabs" id="tabs" aria-label="分类"></nav><div class="items" id="items"></div></div>
    <footer>
      <span class="total" id="oTotal">¥0</span><span class="quote" id="oQuote"></span><span class="sp"></span>
      <button class="btn" id="oCalc" type="button" disabled>算价</button>
      <button class="btn red" id="oDone" type="button">点好了</button>
    </footer>
  </div>

  <!-- 选店 -->
  <div class="sheet" id="storeSheet" role="dialog" aria-label="选门店">
    <header><span>选一家店</span><span class="sp"></span><button class="chip" type="button" data-close>返回 <kbd>Esc</kbd></button></header>
    <div class="body"><div class="stores" id="storeList">加载中…</div></div>
  </div>

  <!-- 聊聊 -->
  <div class="sheet" id="chatSheet" role="dialog" aria-label="和小麦聊聊" style="max-height:60vh">
    <header><span>和小麦聊聊</span><span class="sp"></span><button class="chip" type="button" data-close>返回 <kbd>Esc</kbd></button></header>
    <div class="chatlog" id="chatLog" aria-live="polite"></div>
    <form id="chatForm"><label class="sr" for="chatInput">对小麦说</label><input id="chatInput" autocomplete="off" maxlength="200" placeholder="比如: 我想吃点辣的,预算 30"><button class="btn" id="chatBtn">说</button></form>
  </div>
  </section>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const yuan = n => '¥' + (Math.round(n * 100) / 100);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NPC_X = 36;                       // 小麦在场景里的横向位置(vw)

let sid = null, cfg = {demo: true, chat: false};
let state = {store: null, cart: {lines: [], total: 0}, pending: null};
let saved = null;                       // 最近选定的门店 {storeCode, name}, 与工坊页共用
try { saved = JSON.parse(sessionStorage.getItem('store') || 'null'); } catch (e) {}

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : '请求失败');
  return j;
}
const cartCount = () => state.cart.lines.reduce((a, l) => a + l.quantity, 0);
const qtyOf = code => (state.cart.lines.find(l => l.code === code) || {}).quantity || 0;
function storeName() {
  const c = state.store && state.store.store_code;
  if (!c) return null;
  return saved && saved.storeCode === c ? saved.name.replace('麦当劳', '') : '门店 ' + c;
}
function updateHud() {
  $('storeChip').textContent = storeName() || '未选门店';
  $('cartChip').textContent = `订单 ${yuan(state.cart.total)}` + (cartCount() ? `(${cartCount()}件)` : '');
  $('locName').textContent = '地点・' + (storeName() || '点单台');
}
let toastTimer = null;
function toast(t) {
  const e = $('toast'); e.textContent = t; e.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove('on'), 2200);
}

/* ---------- 第一幕: 走动与靠近判定 ---------- */
const keys = {l: false, r: false};
let px = 12, last = 0, isNear = false, vnOpen = false;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!vnOpen) {
    const d = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), me = $('me');
    if (d) {
      px = Math.max(4, Math.min(96, px + d * 30 * dt));
      me.style.left = px + '%'; me.style.setProperty('--face', d); me.classList.add('walk');
    } else me.classList.remove('walk');
    const n = Math.abs(px - NPC_X) < 9;
    if (n !== isNear) { isNear = n; $('tip').hidden = !n; $('npc').classList.toggle('near', n); }
  }
  requestAnimationFrame(frame);
}
function seeds(host) {
  if (reduce) return;
  for (let i = 0; i < 16; i++) {
    const s = el('i', 'seed');
    s.style.cssText = `left:${Math.random() * 100}%;width:${10 + Math.random() * 8}px;animation-duration:${9 + Math.random() * 8}s;` +
      `animation-delay:-${Math.random() * 14}s;--dx:${(Math.random() - .5) * 120}px;--rot:${Math.random() * 360}deg`;
    host.append(s);
  }
}
function hold(btn, key) {
  const on = v => e => { e.preventDefault(); keys[key] = v; };
  btn.addEventListener('pointerdown', on(true));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, () => { keys[key] = false; }));
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); keys[key] = true; } });
  btn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') keys[key] = false; });
}
